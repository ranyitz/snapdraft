name: Bug report
description: Report a bug in Snapdraft
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the problem clearly.
    validations:
      required: true
  - type: input
    id: snapdraft_version
    attributes:
      label: Snapdraft version
      placeholder: 0.1.0
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: macOS 14.6
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs
      description: Paste anything relevant here.
